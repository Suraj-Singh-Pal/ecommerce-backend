
# ==================================

# APPLICATION CONFIGURATION

# ==================================

spring.application.name=ecommerce-backend

# ==================================

# DATABASE CONFIGURATION

# ==================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================

# JPA / HIBERNATE CONFIGURATION

# ==================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================

# SERVER CONFIGURATION

# ==================================

server.port=8080

# ==================================

# JWT CONFIGURATION

# ==================================

jwt.secret=${JWT_SECRET: MySuperSecretKeyForEcommerceApplication2026Secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================================

# LOGGING

# ==================================

logging.level.org.springframework.security=DEBUG
